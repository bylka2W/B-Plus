[package]
name = "bplus"
version = "3.0.4.0"
edition = "2021"
description = "B+ state machine compiler — Metal Stack + AI optimizer + LLVM codegen"

[dependencies]
inkwell = { version = "0.4", features = ["llvm18-0"] }
pest = "2.7"
pest_derive = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
