name: Mirror to GitVerse and GitFlic

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Push to Mirrors
      run: |
        # Push to GitVerse
        git remote remove gitverse || true
        git remote add gitverse https://${{ secrets.GITVERSE_USER }}:${{ secrets.GITVERSE_TOKEN }}@gitverse.ru/bylka2W/B-Plus.git
        git push gitverse main --force

        # Push to GitFlic
        git remote remove gitflic || true
        git remote add gitflic https://${{ secrets.GITFLIC_USER }}:${{ secrets.GITFLIC_TOKEN }}@gitflic.ru/bylka2W/B-Plus.git
        git push gitflic main --force