name: Mirror

on:
  push:
    branches: [main]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitVerse
        run: |
          git remote add gitverse https://gitverse.ru/bylka2W/B-Plus.git 2>/dev/null || \
            git remote set-url gitverse https://gitverse.ru/bylka2W/B-Plus.git
          git push gitverse --all
          git push gitverse --tags

      - name: Push to GitFlic
        env:
          GITFLIC_TOKEN: ${{ secrets.GITFLIC_TOKEN }}
        run: |
          git remote add gitflic https://oauth2:${GITFLIC_TOKEN}@gitflic.ru/project/bylka2w/b-plus.git 2>/dev/null || \
            git remote set-url gitflic https://oauth2:${GITFLIC_TOKEN}@gitflic.ru/project/bylka2w/b-plus.git
          git push gitflic --all
          git push gitflic --tags
